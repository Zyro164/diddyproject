# picom config tuned for a Windows 11 style desktop (acrylic blur + rounded corners)
backend = "glx";
vsync = false;
detect-client-opacity = true;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = -8;
shadow-exclude = [
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfce4-notifyd'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'"
];

blur-background = false;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-frame = false;
blur-background-fixed = false;
blur-kern = "3x3box";

wintypes:
{
  tooltip      = { shadow = false; opacity = 0.95; blur-background = false; };
  popup_menu   = { shadow = true;  blur-background = false; };
  dropdown_menu= { shadow = true;  blur-background = false; };
  utility      = { shadow = true;  blur-background = false; };
  dock         = { shadow = false; blur-background = false; };
  desktop      = { shadow = false; blur-background = false; };
  normal       = { shadow = true;  blur-background = false; };
};
